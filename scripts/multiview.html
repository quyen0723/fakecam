<!doctype html>
<!-- Multi-view for 4 fake cameras. HLS via MediaMTX, loopback (§7). Port via ?hls= param. -->
<html>
<head>
<meta charset="utf-8">
<title>fakecam — 4 camera multi-view</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
  body { margin: 0; background: #111; color: #ccc; font-family: ui-monospace, monospace; }
  header { padding: 8px 12px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 0 4px; }
  .cell { position: relative; background: #000; }
  video { width: 100%; display: block; }
  .label { position: absolute; top: 6px; left: 6px; font-size: 12px;
           background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 3px; }
  .err { color: #f88; }
</style>
</head>
<body>
<header>fakecam 4-up — HLS loopback · stream lag vài giây (HLS) — không dùng để đo p95</header>
<div class="grid" id="grid"></div>
<script>
  // Config via URL params, no hardcoded ports/cams (SSoT fix A3):
  //   ?cams=cam01,cam02,cam03,cam04&hls=8888
  // Defaults match config/config.yaml — keep them in sync when config changes.
  const q = new URLSearchParams(location.search);
  const cams = (q.get("cams") || "cam01,cam02,cam03,cam04").split(",");
  const hlsPort = q.get("hls") || "8888";
  const grid = document.getElementById("grid");
  for (const cam of cams) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<span class="label">${cam}</span><video muted autoplay playsinline preload="none"></video>`;
    grid.appendChild(cell);
    const v = cell.querySelector("video");
    // HLS only plays natively in Safari; Chrome/Firefox need hls.js
    if (v.canPlayType("application/vnd.apple.mpegurl")) {
      v.src = `http://127.0.0.1:${hlsPort}/live/${cam}/index.m3u8`;
    } else if (window.Hls && Hls.isSupported()) {
      // Stagger + retry: 4 simultaneous HLS starts can drop streams at startup.
      const label = cell.querySelector("span");
      setTimeout(() => start(cam, v, label, 1), (cams.indexOf(cam)) * 1500);
    } else {
      cell.innerHTML = `<span class="err">browser không hỗ trợ HLS</span>`;
    }
  }

  function start(cam, v, label, attempt) {
    label.textContent = `${cam} — loading`;
    const hls = new Hls();
    hls.loadSource(`http://127.0.0.1:${hlsPort}/live/${cam}/index.m3u8`);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      hls.destroy();
      if (attempt < 3) {
        label.textContent = `${cam} — retry ${attempt}/3`;
        setTimeout(() => start(cam, v, label, attempt + 1), 2000);
      } else {
        label.textContent = `${cam} — stream error (chạy read_smoke để kiểm tra server)`;
      }
    });
    hls.on(Hls.Events.PLAYING, () => { label.textContent = cam; });
  }
</script>
</body>
</html>
